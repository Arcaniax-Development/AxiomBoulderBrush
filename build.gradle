allprojects {
	group = project.findProperty("maven_group")
	version = project.findProperty("mod_version")
}

tasks.register("buildAll") {
	group = "build"
	description = "Build all Minecraft targets"
	dependsOn(":mod-261:build", ":mod-2612:build", ":mod-263:build", ":mod-12111:build")
	finalizedBy("collectReleaseJars")
}

tasks.register("yguardAll") {
	group = "build"
	description = "Run yGuard for all Minecraft targets"
	dependsOn(":mod-261:yguard", ":mod-2612:yguard", ":mod-263:yguard", ":mod-12111:yguard")
}

tasks.register("collectReleaseJars", Copy) {
	group = "build"
	description = "Collect all final jars into root build/releases"
	dependsOn("yguardAll")
	into(layout.buildDirectory.dir("releases"))

	from("mod-12111/build/libs") {
		include "Arceon x Axiom * - for MC 1.21.jar"
	}
	from("mod-2612/build/libs") {
		include "Arceon x Axiom * - for MC 26.2.jar"
	}
	from("mod-263/build/libs") {
		include "Arceon x Axiom * - for MC 26.3.jar"
	}
}
