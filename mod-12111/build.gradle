plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version_12111}"
	id 'maven-publish'
}

base {
	archivesName = "${archives_base_name}-mc1.21.11"
}

repositories {
	maven { url = "https://jitpack.io" }
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}
	mavenCentral()
}

configurations {
	yguardRuntime
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version_12111}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version_12111}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version_12111}"
	modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${fabric_version_12111}"
	implementation "org.joml:joml:${jomlVersion}"
	modImplementation("com.moulberry:mixinconstraints:1.0.9")
	yguardRuntime 'com.yworks:yguard:4.1.1'
	modCompileOnly axiom_dependency_12111
	modCompileOnly "com.github.moulberry:AxiomClientAPI:1.0.5.3"
}

sourceSets {
	main {
		java.srcDirs = ["../common/src/main/java", "src/main/java"]
		resources.srcDirs = ["../common/src/main/resources", "src/main/resources"]
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dependency", minecraft_version_12111
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_dependency": minecraft_version_12111
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(21) }
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

loom {
	enableTransitiveAccessWideners = false
}

tasks.register('installMod', Copy) {
	group = 'distribution'
	def outputJar = layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}.jar").get().asFile
	from(outputJar)
	into("C:/Users/lesle/AppData/Roaming/ModrinthApp/profiles/${modrinth_profile_12111}/mods")
	doFirst { println "Copying ${outputJar.name} to ${modrinth_profile_12111} mods folder..." }
}

tasks.register('yguard') {
	group = 'build'
	dependsOn tasks.named('remapJar')
	doLast {
		def inputJar = layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}.jar").get().asFile.absolutePath
		def outputJar = layout.buildDirectory.file("libs/Arceon x Axiom ${version} - for MC 1.21.jar").get().asFile.absolutePath
		def yguardLog = layout.buildDirectory.file("yguard.log").get().asFile.absolutePath
		ant.taskdef(name: 'yguard', classname: 'com.yworks.yguard.YGuardTask', classpath: configurations.yguardRuntime.asPath)
		ant.yguard {
			inoutpair(in: inputJar, out: outputJar)
			rename(logfile: yguardLog) {
				keep {
					'class'(name: 'net.arcaniax.arceon.axiom.ArceonClient')
					'class'(name: 'net.arcaniax.arceon.axiom.mixin.EditorUIMixin')
					'class'(name: 'net.arcaniax.arceon.axiom.mixin.ToolsWindowMixin')
					'class'(name: 'net.arcaniax.arceon.axiom.mixin.AxiomMixinPlugin')
				}
			}
		}
	}
	finalizedBy tasks.named('installMod')
}

tasks.build { finalizedBy tasks.installMod }
